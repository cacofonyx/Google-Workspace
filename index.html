<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f1f3f4; }
        .wrapper { display: flex; flex-direction: column; height: 100vh; }
        
        /* The Tab Bar Layout */
        .tab-bar { display: flex; background: #ffffff; border-bottom: 1px solid #dadce0; padding: 6px 10px 0 10px; height: 40px; box-sizing: border-box; }
        .tab { padding: 8px 24px; cursor: pointer; border-radius: 8px 8px 0 0; font-size: 14px; font-weight: 500; color: #5f6368; background: transparent; transition: background 0.2s; margin-right: 4px; user-select: none; }
        .tab:hover { background: #f1f3f4; }
        .tab.active { background: #e8f0fe; color: #1a73e8; font-weight: 600; border-bottom: 2px solid #1a73e8; }
        
        /* Main Application Window Container */
        .content { flex: 1; position: relative; background: #ffffff; }
        webview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: none; }
        webview.active { display: block; }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Two Tab Bars at the top -->
        <div class="tab-bar">
            <div id="tab-gmail" class="tab active" onclick="switchTab('gmail')">Gmail</div>
            <div id="tab-calendar" class="tab" onclick="switchTab('calendar')">Calendar</div>
        </div>
        
        <!-- The content view area -->
        <div class="content">
            <webview id="view-gmail" class="active" src="https://gmail.com"></webview>
            <webview id="view-calendar" src="https://calendar.google.com"></webview>
        </div>
    </div>

    <script>
        function switchTab(target) {
            // Remove active status from all tabs and views
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('webview').forEach(v => v.classList.remove('active'));
            
            // Activate the selected tab and view
            document.getElementById('tab-' + target).classList.add('active');
            document.getElementById('view-' + target).classList.add('active');
        }
    </script>
</body>
</html>
